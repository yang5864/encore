    unit: share
    notes: "아이돌 시즌 중 돌발 사건 비율. 근거: 기획서 8.24(약 23%, 잦지만 너무 많지 않게)"
    added: 2026-11-13
    revised: ""
  - name: target_reputation22_label
    status: active

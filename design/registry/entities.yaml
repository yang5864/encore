    notes: "이벤트 2개 이상 시즌 비율. 데뷔·시상식+재계약만 예외"
    added: 2026-11-13
    revised: ""
  - name: target_incident_share
    status: active
    source: design/gdd/event-flow.md
    referenced_by:
      - design/gdd/event-flow.md
      - design/gdd/fandom-team.md
